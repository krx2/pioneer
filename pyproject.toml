[project]
name = "pioneer"
version = "0.1.0"
description = "Satisfactory AI Planning Assistant"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "pydantic>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "pillow>=10.0",  # `python -m pioneer.icons`: importing the game's icons
]

[project.scripts]
pioneer = "pioneer.startup:main"
pioneer-web = "pioneer.web.__main__:main"
pioneer-ask = "pioneer.app.__main__:main"
pioneer-import-icons = "pioneer.icons:main"
pioneer-cut-map-tiles = "pioneer.map_image:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pioneer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # `from tests.game_data import ...`, also when one file is run on its own
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
