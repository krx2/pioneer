name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: ruff format --check .
      # The live-model tests stay skipped: PIONEER_LIVE_LLM_TESTS is unset here, and there's no
      # model to ask. Everything else runs on the committed game data and save files.
      - run: pytest -q
